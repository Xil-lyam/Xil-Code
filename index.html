/* ---------- Emmet simplifié ---------- */
function emmet(a){

  const tag=m[1]||'div',n=+m[3]||1,cls=[...m[2].matchAll(/\.([\w-]+)/g)].map(x=>x[1]),id=(m[2].match(/#([\w-]+)/)||[])[1];
  let at=(id?` id="${id}"`:'')+(cls.length?` class="${cls.join(' ')}"`:''),out=[];
  for(let i=0;i<n;i++){let s;
   if(VOID.includes(tag)){s=`<${tag}${at}${tag=='img'?' src="" alt=""':''}>`;if(!used){s=s.replace('src=""','src="§"');used=true}}
   else if(ps.length>1)s=`<${tag}${at}>\n${ind}  ${build(ps.slice(1),ind+'  ')}\n${ind}</${tag}>`;
   else{s=`<${tag}${at}>${used?'':'§'}</${tag}>`;used=true}
   out.push(s)}
  return out.join('\n'+ind)};

 else for(const[r,x]of JSX)if(r.test(line))t.push(x);
 L.innerHTML=t.length?'💡 '+t.join(' · '):'💡 Continue ! Tape le début d’un mot pour voir les suggestions.'}
function ins(txt){ta.focus();if(!document.execCommand('insertText',false,txt))ta.setRangeText(txt,ta.selectionStart,ta.selectionEnd,'end')}
const indent=()=>{const p=ta.selectionStart,s=ta.value.lastIndexOf('\n',p-1)+1;return ta.value.slice(s,p).match(/^\s*/)[0]};
function toast(m){if(!learnOn)return;const T=$('#toast');T.textContent='✨ '+m;T.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>T.style.display='none',3500)}

/* ---------- Suggestions ---------- */
let ac={items:[],i:0,s:0};
function suggest(force){
 const p=ta.selectionStart,b=ta.value.slice(0,p);let items=[],s=p,m;
 if(cur=='html'&&(m=b.match(/<([\w-]*)$/))){const w=m[1].toLowerCase();s=p-w.length;
  items=Object.keys(TAGS).filter(k=>k.startsWith(w)&&k!=w).sort().map(k=>({l:k,t:VOID.includes(k)?k+' §>':k+'>§</'+k+'>',d:TAGS[k]}))}
 else{m=b.match(cur=='html'?/[\w!:.#>*-]+$/:/[\w$-]+$/);const w=m?m[0]:'';if(!w&&!force)return hide();s=p-w.length;const lw=w.toLowerCase();
  if(cur=='html'&&w){const e=emmet(w);if(e&&!(w in TAGS&&!/[.#*>]/.test(w)&&false))items.push({l:w,t:e,d:'Emmet → '+e.replace(/\n\s*/g,' ').replace('§','').slice(0,40)})}
  const L=SNIP[cur].filter(x=>x[0].toLowerCase().startsWith(lw)&&x[0]!=w||(x[0]==w&&x[1]!=w+'§'&&cur!='css')).map(x=>({l:x[0],t:x[1],d:x[2]}));
  items=L.filter(x=>x.l==w).concat(items,L.filter(x=>x.l!=w))}
 items=items.slice(0,Math.max(3,Math.min(8,Math.floor(($('#ed').clientHeight-10)/30))));if(!items.length)return hide();
 ac={items,i:0,s};showPop()}
function showPop(){pop.innerHTML=ac.items.map((x,i)=>`<div class="${i==ac.i?'on':''}" data-i="${i}"><b>${esc(x.l)}</b><span>${esc(x.d)}</span></div>`).join('');pop.style.display='block';
 const{r,c}=lineInfo(),ed=$('#ed');let x=34+8+c*CW-ta.scrollLeft,y=6+(r+1)*LH-ta.scrollTop;
 x=Math.max(50,Math.min(x,ed.clientWidth-pop.offsetWidth-6));if(y+pop.offsetHeight>ed.clientHeight)y-=LH+pop.offsetHeight;
 pop.style.left=x+'px';pop.style.top=Math.max(0,y)+'px'}
function hide(){pop.style.display='none';ac.items=[]}
function accept(it){const ind=indent();ta.setSelectionRange(ac.s,ta.selectionStart);let t=it.t.replace(/\n/g,'\n'+ind);const i=t.indexOf('§');t=t.replace('§','');
 ins(t);if(i>=0)ta.setSelectionRange(ac.s+i,ac.s+i);hide();toast(`${it.l} → ${it.d}`)}
pop.addEventListener('mousedown',e=>{e.preventDefault();const d=e.target.closest('[data-i]');if(d)accept(ac.items[+d.dataset.i])});

ta.addEventListener('input',e=>{hpush();render();autosave();if(/^delete/.test(e.inputType||''))return hide();suggest()});
ta.addEventListener('scroll',()=>{sync();hide()});
ta.addEventListener('keyup',e=>{if(!['ArrowUp','ArrowDown','Enter','Tab','Escape'].includes(e.key))info()});
ta.addEventListener('click',()=>{hide();info()});
ta.addEventListener('blur',()=>setTimeout(()=>{if(document.activeElement!==ta)hide()},150));
const PAIR={'(':')','[':']','{':'}','"':'"',"'":"'",'`':'`'};
ta.addEventListener('keydown',e=>{
 const open=pop.style.display=='block';
 if(open){if(e.key=='ArrowDown'||e.key=='ArrowUp'){e.preventDefault();ac.i=(ac.i+(e.key=='ArrowDown'?1:ac.items.length-1))%ac.items.length;return showPop()}
  if(e.key=='Enter'||e.key=='Tab'){e.preventDefault();return accept(ac.items[ac.i])}
  if(e.key=='Escape'){e.preventDefault();return hide()}}
 if((e.ctrlKey||e.metaKey)&&e.key==' '){e.preventDefault();return suggest(true)}
 if((e.ctrlKey||e.metaKey)&&e.key=='Enter'){e.preventDefault();return run(true)}
 if((e.ctrlKey||e.metaKey)&&e.key=='s'){e.preventDefault();return save()}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='z'){e.preventDefault();return e.shiftKey?redo():undo()}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='y'){e.preventDefault();return redo()}
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 const p=ta.selectionStart,v=ta.value,sel=p!=ta.selectionEnd,a=v[p-1],nx=v[p];
 if(e.key=='Tab'){e.preventDefault();return ins('  ')}
 if(e.key=='Enter'&&!sel){e.preventDefault();const ind=indent();
  if((a=='{'&&nx=='}')||(a=='['&&nx==']')||(a=='('&&nx==')')||(a=='>'&&v.slice(p,p+2)=='</')){ins('\n'+ind+'  \n'+ind);const q=p+ind.length+3;return ta.setSelectionRange(q,q)}
  return ins('\n'+ind+(/[{[(]/.test(a)?'  ':''))}
 if(sel)return;
 if(e.key=='>'&&cur=='html'){const m=v.slice(0,p).match(/<([a-z][\w-]*)(?:\s[^<>]*)?$/i);
  if(m&&!VOID.includes(m[1].toLowerCase())&&!/\/$/.test(v.slice(0,p))){e.preventDefault();ins('></'+m[1]+'>');const q=p+1;return ta.setSelectionRange(q,q)}}
 if(')]}"\'`'.includes(e.key)&&nx==e.key){e.preventDefault();return ta.setSelectionRange(p+1,p+1)}
 if(PAIR[e.key]){if('"\'`'.includes(e.key)&&/\w/.test(a||''))return;e.preventDefault();ins(e.key+PAIR[e.key]);ta.setSelectionRange(p+1,p+1)}
});

/* ---------- Onglets, exécution, console ---------- */
function load(l){hcommit();S[cur]=ta.value;cur=l;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.l==l));ta.value=S[l];ta.scrollTop=0;hide();render();hinit();ta.focus()}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>load(t.dataset.l));
const CONS='<script>(function(){const s=(t,a)=>parent.postMessage({xb:1,t:t,m:a.map(x=>{try{return typeof x=="object"?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(" ")},"*");["log","warn","error","info"].forEach(k=>{const o=console[k];console[k]=(...a)=>{s(k,a);o.apply(console,a)}});onerror=(m,u,l)=>{s("error",[m+" (ligne "+l+")"])};addEventListener("unhandledrejection",e=>s("error",[e.reason]))})()<\/script>';
function doc(withCons){S[cur]=ta.value;let h=S.html;const css='<style>\n'+S.css+'\n</style>',js='<script>\n'+S.js.replace(/<\/script/gi,'<\\/script')+'\n<\/script>';
 h=/<\/head>/i.test(h)?h.replace(/<\/head>/i,m=>css+m):css+h;
 h=/<\/body>/i.test(h)?h.replace(/<\/body>/i,m=>js+m):h+js;
 if(withCons)h=/<head[^>]*>/i.test(h)?h.replace(/<head[^>]*>/i,m=>m+CONS):CONS+h;return h}
let errN=0,rt;function autosave(){$('#st').textContent='●';$('#st').style.color='#d97706';clearTimeout(rt);rt=setTimeout(()=>{save();run()},700)}
function run(manual){errN=0;$('#cn').textContent='';$('#con').innerHTML='<div class="sys">Exécuté.</div>';$('#fr').srcdoc=doc(true)}
function save(){S[cur]=ta.value;localStorage.setItem('xb.cur',JSON.stringify(S));$('#st').textContent='●';$('#st').style.color=''}
addEventListener('message',e=>{const d=e.data;if(!d||!d.xb)return;const c=$('#con'),x=document.createElement('div');x.className=d.t;x.textContent='› '+d.m;c.appendChild(x);c.scrollTop=1e9;if(d.t=='error'){errN++;$('#cn').textContent='('+errN+' erreur'+(errN>1?'s':'')+')'}});
$('#bClr').onclick=e=>{e.preventDefault();errN=0;$('#cn').textContent='';$('#con').innerHTML='<div class="sys">Console effacée.</div>'};
$('#bRun').onclick=()=>run(true);$('#bSave').onclick=save;
$('#cbtn').onclick=()=>$('#conw').classList.toggle('open');
$('#bExp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([doc(false)],{type:'text/html'}));a.download='projet.html';a.click()};
$('#bLearn').onclick=()=>{learnOn=!learnOn;localStorage.setItem('xb.learn',learnOn?'1':'0');$('#learn').style.display=learnOn?'':'none';$('#bLearn').style.opacity=learnOn?1:.4};
$('#learn').style.display=learnOn?'':'none';$('#bLearn').style.opacity=learnOn?1:.4;

/* ---------- Formatage ---------- */
$('#bFmt').onclick=()=>{let d=0,L=ta.value.split('\n').map(x=>x.trim());
 if(cur=='html'){L=L.filter((x,i)=>x||L[i-1]);L=L.map(x=>{const o=(x.match(/<(?!\/|!|(?:br|hr|img|input|meta|link)\b)[a-z][\w-]*(?:\s[^>]*)?(?<!\/)>/gi)||[]).length,c=(x.match(/<\/[a-z]/gi)||[]).length,pd=Math.max(0,d-(/^<\//.test(x)?1:0));d=Math.max(0,d+o-c);return x?'  '.repeat(pd)+x:x})}
 else L=L.map(x=>{const o=(x.match(/[{[(]/g)||[]).length,c=(x.match(/[}\])]/g)||[]).length,pd=Math.max(0,d-(/^[}\])]/.test(x)?1:0));d=Math.max(0,d+o-c);return x?'  '.repeat(pd)+x:x});
 ta.select();ins(L.join('\n'));toast('Code reformaté : indentation propre = code lisible')};

/* ---------- Projets ---------- */
const PR=()=>JSON.parse(localStorage.getItem('xb.prj')||'{}');
function plist(){const P=PR(),l=$('#plist');l.innerHTML=Object.keys(P).map(k=>`<div class="it" data-k="${esc(k)}"><span>${esc(k)}</span><span data-d="${esc(k)}">✕</span></div>`).join('')||'<small style="color:var(--m)">Aucun projet. Clique « + Nouveau » pour sauver celui-ci.</small>'}
$('#bPrj').onclick=()=>{plist();$('#drw').classList.add('open')};
$('#bNew').onclick=()=>{const n=prompt('Nom du projet ?');if(!n)return;S[cur]=ta.value;const P=PR();P[n]={...S};localStorage.setItem('xb.prj',JSON.stringify(P));plist()};
$('#plist').onclick=e=>{const P=PR(),d=e.target.dataset.d,it=e.target.closest('.it');
 if(d){delete P[d];localStorage.setItem('xb.prj',JSON.stringify(P));return plist()}
 if(it){S={...P[it.dataset.k]};ta.value=S[cur];HS={};hinit();render();run();$('#drw').classList.remove('open')}};
document.addEventListener('click',e=>{if(!e.target.closest('#drw,#bPrj'))$('#drw').classList.remove('open');if(!e.target.closest('#bMenu'))$('#menu').classList.remove('open')});
$('#bMenu').onclick=()=>$('#menu').classList.toggle('open');
$('#bCons').onclick=()=>$('#conw').classList.toggle('open');
$('#bPv').onclick=()=>{const on=document.body.classList.toggle('pvonly');$('#bPv').textContent=on?'✏️ Revenir au code':'👁 Aperçu seul';if(!on)setTimeout(render,50)};

ta.value=S.html;render();run();

/* ---------- Annuler / Rétablir (historique séparé pour HTML, CSS et JS) ---------- */
let HS={},ht;
const hs=()=>HS[cur]||(HS[cur]={st:[{v:ta.value,s:ta.selectionStart,e:ta.selectionEnd}],i:0});
function hinit(){hs();hbtn()}
function hcommit(){clearTimeout(ht);const h=hs();if(h.st[h.i].v===ta.value)return;h.st.length=h.i+1;h.st.push({v:ta.value,s:ta.selectionStart,e:ta.selectionEnd});if(h.st.length>300)h.st.shift();h.i=h.st.length-1}
function hpush(){clearTimeout(ht);ht=setTimeout(()=>{hcommit();hbtn()},500);hbtn()}
function happly(n){ta.value=n.v;ta.setSelectionRange(n.s,n.e);hide();
 const r=n.v.slice(0,n.s).split('\n').length-1,y=6+r*LH;if(y<ta.scrollTop||y>ta.scrollTop+ta.clientHeight-LH*2)ta.scrollTop=Math.max(0,y-ta.clientHeight/2);
 render();autosave();hbtn()}
function undo(){hcommit();const h=hs();if(h.i>0){h.i--;happly(h.st[h.i])}}
function redo(){hcommit();const h=hs();if(h.i<h.st.length-1){h.i++;happly(h.st[h.i])}}
function hbtn(){const h=hs(),dirty=ta.value!==h.st[h.i].v;$('#bUndo').disabled=!(h.i>0||dirty);$('#bRedo').disabled=dirty||h.i>=h.st.length-1}
['#bUndo','#bRedo'].forEach(q=>$(q).addEventListener('mousedown',e=>e.preventDefault()));
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;
ta.addEventListener('beforeinput',e=>{if(e.inputType=='historyUndo'){e.preventDefault();undo()}else if(e.inputType=='historyRedo'){e.preventDefault();redo()}});
hinit();

/* ---------- Écran partagé 66 % aperçu / 34 % code ---------- */
const mn=$('#mn'),grip=$('#grip');let R=+localStorage.getItem('xb.r')||66,maxH=innerHeight;
function setR(){maxH=Math.max(maxH,innerHeight);const kb=matchMedia('(orientation:portrait)').matches&&innerHeight<maxH*.75;mn.style.setProperty('--r',kb?Math.min(R,38):R);requestAnimationFrame(()=>{render()})}
grip.addEventListener('pointerdown',e=>{grip.setPointerCapture(e.pointerId);
 const mv=ev=>{const b=mn.getBoundingClientRect();R=Math.round(Math.min(85,Math.max(20,(ev.clientY-b.top)/b.height*100)));setR()};
 const up=()=>{grip.removeEventListener('pointermove',mv);grip.removeEventListener('pointerup',up);localStorage.setItem('xb.r',R)};
 grip.addEventListener('pointermove',mv);grip.addEventListener('pointerup',up)});
grip.addEventListener('dblclick',()=>{R=66;localStorage.setItem('xb.r',R);setR()});
addEventListener('resize',setR);addEventListener('orientationchange',()=>{maxH=0;setTimeout(setR,300)});setR();

/* ---------- PWA ---------- */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
let dip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('#bInst').style.display=''});
$('#bInst').onclick=async()=>{if(!dip)return;dip.prompt();await dip.userChoice;dip=null;$('#bInst').style.display='none'};
addEventListener('appinstalled',()=>{$('#bInst').style.display='none'});
</script>
