<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<title>X'il.Book — Code Studio</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
<style>
:root{--bg:#090b12;--panel:#101522;--panel2:#151c2b;--line:#252d40;--text:#e8edf8;--muted:#8490a8;--accent:#8b5cf6;--accent2:#22d3ee;--green:#36d399;--red:#fb7185;--top:56px}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:1px solid var(--line);background:#1a2232;border-radius:9px;padding:8px 11px}button:active{transform:scale(.98)}button.primary{background:linear-gradient(135deg,#7c3aed,#5b5bd6);border-color:#8b5cf6}button.icon{min-width:36px;padding:7px}button.active{border-color:var(--accent);background:#292044}.muted{color:var(--muted)}.tiny{font-size:11px}
header{height:var(--top);display:flex;align-items:center;gap:12px;padding:0 14px;background:#0d111b;border-bottom:1px solid var(--line);position:relative;z-index:5}
.logo{font-weight:850;letter-spacing:-.6px;font-size:17px;white-space:nowrap}.logo b{color:#a78bfa}.logo small{display:block;font-size:9px;color:var(--muted);letter-spacing:2px;font-weight:600;margin-top:-3px}
.project-name{background:transparent;border:0;color:var(--text);font-weight:650;min-width:0;width:180px;padding:7px}
.header-actions{margin-left:auto;display:flex;gap:7px;align-items:center}.status{font-size:11px;color:var(--green);white-space:nowrap}
main{height:calc(100dvh - var(--top));display:flex;flex-direction:column;min-height:0}
.toolbar{height:47px;flex-shrink:0;display:flex;align-items:center;gap:7px;padding:6px 12px;border-bottom:1px solid var(--line);background:#0c111b;overflow-x:auto;white-space:nowrap}
.toolbar .spacer{flex:1}.workspace{display:flex;flex:1;min-height:0;gap:0}
.left{width:50%;min-width:260px;display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0}
.editor-top{height:43px;display:flex;align-items:center;padding:0 10px;gap:6px;border-bottom:1px solid var(--line);background:var(--panel)}
.tab{border:0;background:transparent;border-radius:7px;padding:8px 13px;color:var(--muted);font-weight:650}.tab.active{background:#28213f;color:#c4b5fd}.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:#f97316}.tab[data-lang=css] .dot{background:#38bdf8}.tab[data-lang=js] .dot{background:#facc15}
.editor-area{flex:1;min-height:0;position:relative;background:#171b27}.CodeMirror{height:100%;font:13px/1.65 'SFMono-Regular',Consolas,monospace}.CodeMirror-gutters{background:#141925;border-right:1px solid #252d40}.CodeMirror-linenumber{color:#68738b}.CodeMirror-cursor{border-left:2px solid #c4b5fd!important}.CodeMirror-selected{background:#39345c!important}
.CodeMirror-hints{z-index:9999;background:#171d2b;border:1px solid #514477;color:#e8edf8;box-shadow:0 10px 35px #0009}
.CodeMirror-hint{color:#e8edf8;padding:6px 10px}.CodeMirror-hint-active{background:#514078;color:#fff}
.diagnostic{display:flex;gap:7px;align-items:flex-start;padding:4px 0;border-bottom:1px solid #222b3b;cursor:pointer}
.diagnostic b{color:#fb7185}.diagnostic.warn b{color:#fbbf24}.diagnostic span{color:#cbd5e1}
.cm-error-line{background:linear-gradient(90deg,#fb718522,transparent)}
.fallback-editor{width:100%;height:100%;resize:none;border:0;outline:0;background:#171b27;color:#e6e6e6;padding:15px;font:13px/1.65 monospace;tab-size:2}
.bottom-editor{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#111725;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
.right{flex:1;min-width:260px;display:flex;flex-direction:column;min-height:0;background:#fff;color:#111}
.preview-head{height:43px;display:flex;align-items:center;gap:8px;padding:0 11px;background:var(--panel);color:var(--text);border-bottom:1px solid var(--line)}
.preview-head strong{font-size:13px}.preview-head .spacer{flex:1}.preview-frame-wrap{flex:1;min-height:0;background:white;position:relative}.preview-frame{width:100%;height:100%;border:0;background:#fff}
.console{height:120px;max-height:35%;background:#0c111b;color:#d8deed;border-top:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.console-head{height:34px;display:flex;align-items:center;padding:0 10px;gap:8px;border-bottom:1px solid var(--line);font-size:12px}.console-body{overflow:auto;padding:7px 11px;font:11px/1.5 monospace;white-space:pre-wrap;flex:1}.log-error{color:#fb7185}.log-warn{color:#fbbf24}.log-info{color:#93c5fd}
.drawer{position:fixed;inset:0;background:#0009;z-index:20;display:none;align-items:flex-end}.drawer.open{display:flex}.drawer-card{width:100%;max-height:78dvh;overflow:auto;background:#111827;border:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px}.drawer-title{display:flex;justify-content:space-between;align-items:center;font-weight:750;margin-bottom:12px}
.project-list{display:grid;gap:8px}.project-item{display:flex;align-items:center;gap:8px;background:#1a2232;border:1px solid var(--line);border-radius:10px;padding:10px}.project-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=text]{background:#0c111b;border:1px solid var(--line);color:var(--text);padding:9px;border-radius:8px;width:100%}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,20px);background:#25213a;color:#e9ddff;border:1px solid #6d50b5;padding:9px 14px;border-radius:10px;opacity:0;transition:.2s;z-index:50;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}
.mobile-switch{display:none}
@media(max-width:760px){header{padding:0 9px;gap:7px}.logo{font-size:15px}.logo small{display:none}.project-name{width:100px;font-size:12px}.header-actions{gap:4px}.header-actions button{padding:7px 8px}.status{display:none}.toolbar{height:44px;padding:5px 8px}.workspace{position:relative}.left,.right{width:100%;min-width:0}.left{border-right:0}.right{display:none}.workspace.show-preview .left{display:none}.workspace.show-preview .right{display:flex}.mobile-switch{display:inline-flex}.console{height:105px}.editor-top{height:42px}.tab{padding:7px 10px;font-size:12px}}
@media(min-width:761px){.workspace{flex-direction:row}.left,.right{flex:1;width:50%}}

/* Vue permanente en écran partagé : aperçu en haut, éditeur en bas */
.workspace{flex-direction:column!important;min-height:0}
.right{order:0!important;display:flex!important;flex:0 0 42%!important;width:100%!important;min-width:0!important;min-height:170px!important;border-bottom:1px solid var(--line)}
.left{order:1!important;display:flex!important;flex:1 1 58%!important;width:100%!important;min-width:0!important;min-height:180px!important;border-right:0!important}
.preview-frame-wrap{flex:1 1 auto;min-height:0}
.console{height:64px;max-height:22%;flex-shrink:0}
.mobile-switch{display:none!important}
/* Répartition adaptative : l'aperçu est prioritaire, le code reste compact. */
.workspace{overflow:hidden}
.right{flex:0 1 66%!important;min-height:110px!important;overflow:hidden}
.left{flex:1 1 34%!important;min-height:110px!important;overflow:hidden}
.preview-frame-wrap{overflow:auto;overscroll-behavior:contain}
.editor-area{overflow:hidden}
.console{height:42px;max-height:16%;min-height:27px}
@media(max-width:760px){
 .workspace.show-preview .left,.workspace.show-preview .right{display:flex!important}
 .right{flex:0 1 66%!important;min-height:105px!important}
 .left{flex:1 1 34%!important;min-height:105px!important}
 .preview-head{height:34px;flex-shrink:0}
 .console{height:36px;max-height:14%;min-height:25px}
 .console-head{height:25px;flex-shrink:0}
 .console-body{padding:3px 8px}
 .editor-top{height:35px;flex-shrink:0}
 .bottom-editor{height:25px;flex-shrink:0}
}

</style>
</head>
<body>
<header>
 <div class="logo">X'<b>il</b>.Book<small>CODE STUDIO</small></div>
 <input class="project-name" id="projectName" value="Mon premier projet" aria-label="Nom du projet">
 <div class="header-actions">
  <span class="status" id="saveStatus">● Sauvegardé</span>
  <button class="icon" id="projectsBtn" title="Mes projets">▤</button>
  <button class="icon" id="settingsBtn" title="Paramètres">⚙</button>
 </div>
</header>
<main>
 <nav class="toolbar">
  <button class="primary" id="runBtn">▶ Exécuter</button>
  <button id="saveBtn">▣ Sauver</button>
  <button id="downloadBtn">⇩ Exporter</button>
  <button id="formatBtn">⌘ Formater</button>
  <span class="spacer"></span>
  <button class="mobile-switch active" id="codeViewBtn">Code</button>
  <button class="mobile-switch" id="previewViewBtn">Aperçu</button>
  <button id="fullscreenBtn" title="Plein écran">⛶</button>
 </nav>
 <section class="workspace" id="workspace">
  <div class="left">
   <div class="editor-top">
    <button class="tab active" data-lang="html"><i class="dot"></i>HTML</button>
    <button class="tab" data-lang="css"><i class="dot"></i>CSS</button>
    <button class="tab" data-lang="js"><i class="dot"></i>JS</button>
    <span class="spacer"></span><span class="tiny muted" id="cursorPos">Ligne 1, Col 1</span>
   </div>
   <div class="editor-area" id="editorArea">
    <textarea class="fallback-editor" id="fallbackEditor" spellcheck="false"></textarea>
   </div>
   <div class="bottom-editor"><span id="editorHint">HTML · Modifie le code pour voir le résultat</span><span>UTF-8&nbsp; · &nbsp;2 espaces</span></div>
  </div>
  <div class="right">
   <div class="preview-head"><strong>◉ Aperçu en direct</strong><span class="tiny muted">index.html</span><span class="spacer"></span><button class="icon" id="refreshBtn" title="Actualiser">↻</button><button class="icon" id="openPreviewBtn" title="Ouvrir dans un nouvel onglet">↗</button></div>
   <div class="preview-frame-wrap"><iframe class="preview-frame" id="preview" title="Aperçu du site" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe></div>
   <div class="console"><div class="console-head"><strong>Console</strong><button class="tiny" id="clearConsole">Effacer</button><span class="spacer"></span><span class="tiny muted" id="consoleCount">0 message</span></div><div class="console-body" id="consoleBody">Prêt. Les messages JavaScript apparaîtront ici.</div></div>
  </div>
 </section>
</main>
<div class="drawer" id="drawer"><div class="drawer-card"><div class="drawer-title"><span id="drawerTitle">Mes projets</span><button id="closeDrawer">✕</button></div><div id="drawerContent"></div></div></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/xml-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/html-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/css-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/javascript-hint.min.js"></script>
<script>
(()=>{'use strict';
const starter={
 html:`<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon premier site</title>
</head>
<body>
  <main class="card">
    <span class="tag">MON PREMIER PROJET</span>
    <h1>Salut le monde ! 👋</h1>
    <p>Bienvenue dans X'il.Book Code Studio.</p>
    <button id="helloBtn">Clique-moi</button>
    <p id="message"></p>
  </main>
</body>
</html>`,
 css:`* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: system-ui, sans-serif;
  color: #172033;
  background: linear-gradient(135deg, #dbeafe, #ede9fe);
}
.card {
  width: min(90%, 440px);
  padding: 36px;
  text-align: center;
  background: white;
  border-radius: 24px;
  box-shadow: 0 20px 60px #27365b22;
}
.tag { color: #7c3aed; font-size: 11px; font-weight: 800; letter-spacing: 2px; }
h1 { font-size: 32px; }
button {
  border: 0; border-radius: 12px; padding: 12px 22px;
  color: white; background: #7c3aed; font-weight: 700;
}`,
 js:`document.querySelector("#helloBtn").addEventListener("click", () => {
  document.querySelector("#message").textContent = "Bravo ! Ton JavaScript fonctionne 🎉";
});`
};
let current='html',editors={},fallback=true,runTimer=null,projects={};
const $=id=>document.getElementById(id);
const keys={html:'xilbook_html',css:'xilbook_css',js:'xilbook_js'};
let code={...starter};
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1900)}
function getCode(lang){return editors[lang]?editors[lang].getValue():$('fallbackEditor').value}
function setCode(lang,value){code[lang]=value;if(editors[lang])editors[lang].setValue(value)}
function setupAutocomplete(cm,lang){
 if(!CodeMirror.showHint)return;
 cm.on('inputRead',(editor,change)=>{
  if(change.text && change.text.join('').length){
   const ch=editor.getCursor().ch, line=editor.getLine(editor.getCursor().line);
   const trigger=lang==='html'?/[<\\/a-z]$/i.test(line):lang==='css'?/[.#a-z-]$/i.test(line):/[.$a-z_]$/i.test(line);
   if(trigger)CodeMirror.showHint(editor,lang==='html'?CodeMirror.hint.html:lang==='css'?CodeMirror.hint.css:CodeMirror.hint.javascript,{completeSingle:false});
  }
 });
 cm.on('keydown',(editor,e)=>{if((e.ctrlKey||e.metaKey)&&e.key===' '){e.preventDefault();CodeMirror.showHint(editor,lang==='html'?CodeMirror.hint.html:lang==='css'?CodeMirror.hint.css:CodeMirror.hint.javascript,{completeSingle:false})}});
}
function initEditor(){
 if(!window.CodeMirror){$('fallbackEditor').value=code.html;fallback=true;return}
 fallback=false;
 const ta=$('fallbackEditor');ta.style.display='none';
 const modes={html:'htmlmixed',css:'css',js:'javascript'};
 ['html','css','js'].forEach(lang=>{
  const host=document.createElement('textarea');host.value=code[lang];$('editorArea').appendChild(host);
  const cm=CodeMirror.fromTextArea(host,{theme:'dracula',mode:modes[lang],lineNumbers:true,indentUnit:2,tabSize:2,indentWithTabs:false,autoCloseBrackets:true,matchBrackets:true,lineWrapping:false,viewportMargin:Infinity});
  cm.on('change',()=>{code[lang]=cm.getValue();markUnsaved();if(lang===current)scheduleRun();});
  setupAutocomplete(cm,lang);
  cm.on('cursorActivity',()=>{const c=cm.getCursor();$('cursorPos').textContent=`Ligne ${c.line+1}, Col ${c.ch+1}`});
  editors[lang]=cm;
  host.nextSibling.style.display=lang===current?'':'none';
 });
}
function showLang(lang){
 current=lang;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.lang===lang));
 if(editors[lang]){Object.entries(editors).forEach(([k,e])=>e.getWrapperElement().style.display=k===lang?'':'none');editors[lang].refresh();editors[lang].focus()}
 else $('fallbackEditor').value=code[lang];
 $('editorHint').textContent=lang.toUpperCase()+' · Modifie le code pour voir le résultat';
}
function markUnsaved(){$('saveStatus').textContent='● Modifications…';$('saveStatus').style.color='#fbbf24';}
function getDocument(){
 let h=getCode('html'),c=getCode('css'),j=getCode('js');
 const cssTag='<style>\n'+c+'\n</style>',jsTag='<script>\n'+j+'\n<\/script>';
 if(/<head[\s>]/i.test(h))h=h.replace(/<\/head>/i,cssTag+'\n</head>');
 else h=cssTag+h;
 if(/<\/body>/i.test(h))h=h.replace(/<\/body>/i,jsTag+'\n</body>');
 else h+=jsTag;
 return h;
}
function clearConsole(){ $('consoleBody').textContent='';$('consoleCount').textContent='0 message'; }
function showDiagnostics(items){
 const box=$('consoleBody');box.innerHTML='';
 $('consoleCount').textContent=items.length+' problème(s)';
 if(!items.length){box.textContent='✓ Aucune erreur détectée dans le code analysé.';box.className='console-body log-info';return}
 box.className='console-body';
 items.forEach(d=>{
  const row=document.createElement('div');row.className='diagnostic'+(d.type==='warn'?' warn':'');
  const b=document.createElement('b');b.textContent=d.type==='warn'?'AVERTISSEMENT':'ERREUR';
  const msg=document.createElement('span');msg.textContent=d.lang.toUpperCase()+' · Ligne '+d.line+' : '+d.message;
  row.append(b,msg);row.onclick=()=>{showLang(d.lang);if(editors[d.lang]){editors[d.lang].setCursor({line:Math.max(0,d.line-1),ch:0});editors[d.lang].focus()}};
  box.appendChild(row);
 });
}
function analyseCode(){
 const issues=[];
 const html=getCode('html'),css=getCode('css'),js=getCode('js');
 // Détecte les erreurs de syntaxe JavaScript avant exécution.
 try{new Function(js)}catch(e){const m=(e.stack||'').match(/<anonymous>:(\\d+):/);issues.push({lang:'js',line:m?Math.max(1,Number(m[1])-3):1,message:e.message,type:'error'})}
 // Vérification simple des accolades CSS.
 let depth=0,cssLine=1,openLine=1;
 for(const ch of css){if(ch==='\\n')cssLine++;if(ch==='{'){depth++;openLine=cssLine}if(ch==='}')depth--}
 if(depth!==0)issues.push({lang:'css',line:depth>0?openLine:1,message:depth>0?'Accolade ouvrante sans fermeture.':'Accolade fermante inattendue.',type:'error'});
 // Détecte les balises HTML usuelles non refermées.
 const voids=new Set(['area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr']);
 const stack=[];const re=/<\\/?([a-z][\\w-]*)\\b[^>]*>/gi;let match;
 while((match=re.exec(html))){const tag=match[1].toLowerCase(),closing=match[0].startsWith('</'),line=html.slice(0,match.index).split('\\n').length;
  if(voids.has(tag)||/\\/>$/.test(match[0]))continue;
  if(closing){const idx=stack.map(x=>x.tag).lastIndexOf(tag);if(idx<0)issues.push({lang:'html',line,message:'Balise de fermeture </'+tag+'> sans ouverture.',type:'warn'});else stack.splice(idx,1)}
  else stack.push({tag,line});
 }
 stack.forEach(x=>issues.push({lang:'html',line:x.line,message:'Balise <'+x.tag+'> probablement non refermée.',type:'warn'}));
 return issues;
}
function run(){
 clearTimeout(runTimer);
 const issues=analyseCode();
 showDiagnostics(issues);
 const frame=$('preview'),doc=getDocument();
 frame.srcdoc=doc;
}
function scheduleRun(){clearTimeout(runTimer);runTimer=setTimeout(run,450)}
function saveProject(silent=false){
 const name=$('projectName').value.trim()||'Sans titre';
 const item={name,code:{html:getCode('html'),css:getCode('css'),js:getCode('js')},updated:Date.now()};
 try{projects=JSON.parse(localStorage.getItem('xilbook_projects')||'{}')}catch(e){projects={}}
 projects[name]=item;
 try{localStorage.setItem('xilbook_projects',JSON.stringify(projects));localStorage.setItem('xilbook_last',name);$('saveStatus').textContent='● Sauvegardé';$('saveStatus').style.color='var(--green)';if(!silent)toast('Projet sauvegardé sur cet appareil ✓')}
 catch(e){toast('Stockage plein ou indisponible');}
}
function loadProject(name){
 const p=projects[name];if(!p)return;
 $('projectName').value=p.name;['html','css','js'].forEach(k=>{code[k]=p.code[k]||'';if(editors[k])editors[k].setValue(code[k])});
 showLang('html');run();$('drawer').classList.remove('open');toast('Projet ouvert');
}
function download(){
 const blob=new Blob([getDocument()],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=(($('projectName').value||'mon-site').replace(/[^a-z0-9-_]/gi,'-'))+'.html';a.click();URL.revokeObjectURL(url);toast('Fichier HTML exporté');
}
function formatCode(){
 const lang=current;let v=getCode(lang);
 // Basic indentation formatter for HTML; safe whitespace formatter for CSS/JS is intentionally conservative.
 if(lang==='html'){v=v.replace(/>\s*</g,'>\n<').split('\n').map(x=>x.trim()).filter(Boolean).join('\n');let depth=0;v=v.split('\n').map(line=>{if(/^<\/(div|main|section|article|header|footer|nav|ul|ol|li|form|body|html|head|table|tr|p|h[1-6])\b/i.test(line))depth=Math.max(0,depth-1);const out='  '.repeat(depth)+line;if(/^<(div|main|section|article|header|footer|nav|ul|ol|li|form|body|html|head|table|tr)\b/i.test(line)&&!/^<.*\/>$/.test(line)&&!/<\/(div|main|section|article|header|footer|nav|ul|ol|li|form|body|html|head|table|tr)>/i.test(line))depth++;return out}).join('\n')}
 else v=v.replace(/[ \t]+$/gm,'').replace(/\n{3,}/g,'\n\n');
 setCode(lang,v);if(editors[lang])editors[lang].refresh();toast('Formatage appliqué');
}
function openProjects(){
 try{projects=JSON.parse(localStorage.getItem('xilbook_projects')||'{}')}catch(e){projects={}}
 $('drawerTitle').textContent='Mes projets';
 const names=Object.keys(projects).sort((a,b)=>projects[b].updated-projects[a].updated);
 $('drawerContent').innerHTML='<div class="modal-actions"><button class="primary" id="newProject">＋ Nouveau projet</button><button id="importProject">Importer HTML</button></div><div class="project-list" style="margin-top:12px"></div>';
 const list=$('drawerContent').querySelector('.project-list');
 if(!names.length)list.innerHTML='<p class="muted">Aucun projet sauvegardé pour le moment.</p>';
 names.forEach(n=>{const el=document.createElement('div');el.className='project-item';const span=document.createElement('span');span.textContent=n;const date=document.createElement('small');date.className='muted';date.textContent=new Date(projects[n].updated).toLocaleDateString('fr-FR');const open=document.createElement('button');open.textContent='Ouvrir';open.onclick=()=>loadProject(n);const del=document.createElement('button');del.textContent='✕';del.onclick=()=>{if(confirm('Supprimer le projet « '+n+' » ?')){delete projects[n];localStorage.setItem('xilbook_projects',JSON.stringify(projects));openProjects()}};el.append(span,date,open,del);list.appendChild(el)});
 $('newProject').onclick=()=>{if(!confirm('Créer un nouveau projet ? Pense à sauvegarder celui en cours.'))return;$('projectName').value='Nouveau projet';['html','css','js'].forEach(k=>setCode(k,starter[k]));showLang('html');run();$('drawer').classList.remove('open')};
 $('importProject').onclick=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='.html,.htm,text/html';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const txt=await f.text();code.html=txt;code.css='';code.js='';Object.keys(editors).forEach(k=>editors[k].setValue(code[k]));$('projectName').value=f.name.replace(/\.(html?|txt)$/i,'');showLang('html');run();$('drawer').classList.remove('open');toast('HTML importé')};inp.click()};
 $('drawer').classList.add('open');
}
function settings(){
 $('drawerTitle').textContent='Paramètres';
 $('drawerContent').innerHTML='<p class="muted">X\'il.Book fonctionne dans ton navigateur. Les projets sont sauvegardés localement sur cet appareil.</p><p><b>Éditeur</b><br><small class="muted">Coloration syntaxique via CodeMirror (connexion Internet nécessaire au premier chargement). Si la bibliothèque ne charge pas, un éditeur texte de secours reste disponible.</small></p><p><b>Aperçu sécurisé</b><br><small class="muted">Le rendu est isolé dans une iframe. Le code que tu exécutes peut toutefois agir dans cet aperçu : n’exécute que du code de confiance.</small></p><div class="modal-actions"><button id="resetBtn">Réinitialiser l’exemple</button><button id="clearDataBtn">Effacer tous mes projets</button></div>';
 $('resetBtn').onclick=()=>{if(confirm('Réinitialiser le code actuel ?')){['html','css','js'].forEach(k=>setCode(k,starter[k]));showLang('html');run();$('drawer').classList.remove('open')}};
 $('clearDataBtn').onclick=()=>{if(confirm('Effacer tous les projets sauvegardés sur cet appareil ?')){localStorage.removeItem('xilbook_projects');projects={};toast('Projets effacés');$('drawer').classList.remove('open')}};
 $('drawer').classList.add('open');
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>showLang(t.dataset.lang)));
$('runBtn').onclick=run;$('refreshBtn').onclick=run;$('saveBtn').onclick=()=>saveProject();$('downloadBtn').onclick=download;$('formatBtn').onclick=formatCode;
$('projectsBtn').onclick=openProjects;$('settingsBtn').onclick=settings;$('closeDrawer').onclick=()=>$('drawer').classList.remove('open');
$('drawer').addEventListener('click',e=>{if(e.target===$('drawer'))$('drawer').classList.remove('open')});
$('clearConsole').onclick=clearConsole;
$('fullscreenBtn').onclick=()=>{const el=$('workspace');if(!document.fullscreenElement)el.requestFullscreen?.();else document.exitFullscreen?.()};
$('codeViewBtn').onclick=()=>{$('workspace').classList.remove('show-preview');$('codeViewBtn').classList.add('active');$('previewViewBtn').classList.remove('active')};
$('previewViewBtn').onclick=()=>{$('workspace').classList.add('show-preview');$('previewViewBtn').classList.add('active');$('codeViewBtn').classList.remove('active');run()};
$('openPreviewBtn').onclick=()=>{const w=window.open();if(w){w.document.open();w.document.write(getDocument());w.document.close()}else toast('Autorise les fenêtres pop-up pour cette action')};
$('fallbackEditor').addEventListener('input',e=>{code[current]=e.target.value;markUnsaved();scheduleRun()});
$('projectName').addEventListener('input',markUnsaved);
window.addEventListener('beforeunload',()=>{if($('saveStatus').textContent.includes('Modifications'))saveProject(true)});
initEditor();
try{const last=localStorage.getItem('xilbook_last'),saved=JSON.parse(localStorage.getItem('xilbook_projects')||'{}');if(last&&saved[last]){code={...starter,...saved[last].code};$('projectName').value=last}}catch(e){}
['html','css','js'].forEach(k=>{if(editors[k])editors[k].setValue(code[k])});
showLang('html');run();
setInterval(()=>{if($('saveStatus').textContent.includes('Modifications'))saveProject(true)},12000);
})();
</script>
